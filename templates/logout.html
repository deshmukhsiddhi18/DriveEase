<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Logout | DriveEase</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>

    <!-- NAVBAR -->

    <header>

        <nav class="navbar">

            <div class="logo">
                DriveEase
            </div>

            <ul class="nav-links">

                <li>
                    <a href="/">
                        Home
                    </a>
                </li>

                <li>
                    <a href="/cars">
                        Cars
                    </a>
                </li>

                <li>
                    <a href="/about">
                        About
                    </a>
                </li>

                <li>
                    <a href="/contact">
                        Contact
                    </a>
                </li>

            </ul>

        </nav>

    </header>


    <!-- LOGOUT SECTION -->

    <section class="logout-section">

        <div class="logout-card">

            <div class="logout-icon">
                ✓
            </div>

            <h1>
                You Have Been Logged Out
            </h1>

            <p>
                Thank you for visiting us.
            </p>

            <p class="logout-message">
                Thank you for using DriveEase Car Rental.
            </p>


            <div class="logout-buttons">

                <a href="{{ url_for('login.login') }}"
                   class="login-btn">
                    Login Again
                </a>

                <a href="{{ url_for('index') }}"
                   class="home-btn">
                    Go to Home
                </a>

            </div>

        </div>

    </section>


    <!-- FOOTER -->

    <footer>

        <p>
            © 2026 DriveEase Car Rental
        </p>

    </footer>

</body>

</html>
