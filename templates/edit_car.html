<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Car | DriveEase</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>


<div class="add-car-container">

    <h1>Edit Car</h1>

    <p>Update car information</p>


    <form
        action="{{ url_for('edit_car', car_id=car.id) }}"
        method="POST">


        <label>Car Name</label>

        <input
            type="text"
            name="car_name"
            value="{{ car.car_name }}"
            required>


        <label>Brand</label>

        <input
            type="text"
            name="brand"
            value="{{ car.brand }}"
            required>


        <label>Fuel Type</label>

        <select name="fuel_type" required>

            <option value="Petrol"
                {% if car.fuel_type == "Petrol" %}selected{% endif %}>
                Petrol
            </option>

            <option value="Diesel"
                {% if car.fuel_type == "Diesel" %}selected{% endif %}>
                Diesel
            </option>

            <option value="CNG"
                {% if car.fuel_type == "CNG" %}selected{% endif %}>
                CNG
            </option>

            <option value="Electric"
                {% if car.fuel_type == "Electric" %}selected{% endif %}>
                Electric
            </option>

        </select>


        <label>Number of Seats</label>

        <input
            type="number"
            name="seats"
            value="{{ car.seats }}"
            required>


        <label>Price Per Day (₹)</label>

        <input
            type="number"
            name="price_per_day"
            value="{{ car.price_per_day }}"
            required>


        <label>Image File Name</label>

        <input
            type="text"
            name="image"
            value="{{ car.image }}"
            required>


        <label>Availability</label>

        <select name="available" required>

            <option value="1"
                {% if car.available %}selected{% endif %}>
                Available
            </option>

            <option value="0"
                {% if not car.available %}selected{% endif %}>
                Not Available
            </option>

        </select>


        <div class="add-car-buttons">

            <button
                type="submit"
                class="submit-btn">
                Update Car
            </button>

            <a
                href="/admin"
                class="reset-btn">
                Cancel
            </a>

        </div>


    </form>

</div>


</body>

</html>
