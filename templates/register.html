<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | DriveEase</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<header>
    <nav class="navbar">
        <div class="logo">DriveEase</div>

        <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="/cars">Cars</a></li>
            <li><a href="/contact">Contact</a></li>
            <li><a href="/login">Login</a></li>
        </ul>
    </nav>
</header>

<section class="register-section">

    <div class="register-container">

        <h1>Create Account</h1>
        <p>Join DriveEase and book your dream car today.</p>

        <form action="/register" method="post">

            <div class="row">
                <input type="text" name="firstname" placeholder="First Name" required>

                <input type="text" name="lastname" placeholder="Last Name" required>
            </div>

            <input type="email" name="email" placeholder="Email Address" required>

            <input type="tel" name="phone" placeholder="Mobile Number" max="10" min="1" required>

            <input type="password" name="password" placeholder="Create Password" required>

            <input type="password" name="confirm_password" placeholder="Confirm Password" required>

            <button type="submit">Create Account</button>

        </form>

        <p class="bottom-text">
            Already have an account?
            <a href="/login">Login</a>
        </p>

    </div>

</section>

<footer>
    <p>&copy; 2026 DriveEase Car Rental</p>
</footer>

</body>
</html>
