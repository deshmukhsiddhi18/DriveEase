<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Poppins", sans-serif;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f4f4f4;
}

/* Login Container */
.admin-login-container {
    width: 380px;
    background: white;
    padding: 35px;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

/* Heading */
.admin-login-container h2 {
    text-align: center;
    margin-bottom: 25px;
    color: black;
    font-size: 28px;
}

/* Input Box */
.input-box {
    margin-bottom: 20px;
}

.input-box label {
    display: block;
    margin-bottom: 8px;
    color:#333;
    font-weight: 600;
}

.input-box input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    outline: none;
    font-size: 15px;
    transition: 0.3s;
}

.input-box input:focus {
    border-color: #667eea;
    box-shadow: 0 0 5px rgba(102,126,234,0.5);
}


/* Login Button */
.login-btn {
    width: 100%;
    padding: 12px;
    background: black;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 17px;
    cursor: pointer;
    transition: 0.3s;
}

.login-btn:hover {
    background: #f59e0b;
    transform: translateY(-2px);
    color: black;
}




/* Responsive */
@media(max-width:450px){

    .admin-login-container{
        width:90%;
        padding:25px;
    }

}


</style>
</head>
<body>

<div class="admin-login-container">

    <h2>Admin Login</h2>

    {% if error %}
    <p class="error-box">{{ error }}</p>
    {% endif %}

    <form action="/admin_login" method="POST">
        <div class="input-box">
            <label>Username</label>
            <input type="text" name="username" required>
        </div>    


        <div class="input-box">
            <label>Password</label>
            <input type="password" name="password" required>
        </div>   
        
        <button type="submit" class="login-btn">Login</button>

    </form>

</div>

</body>
</html>
